<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #e5e5e5; stroke-width: 1; }
      .mutedCard { fill: #fafafa; stroke: #e5e5e5; stroke-width: 1; }
      .border { fill: none; stroke: #e5e5e5; stroke-width: 1; }
      .fg { fill: #171717; }
      .muted { fill: #737373; }
      .faint { fill: #a3a3a3; }
      .primaryBtn { fill: #171717; }
      .primaryBtnText { fill: #fafafa; }
      .destructive { fill: #dc2626; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      .tagPill { fill: #ffffff; stroke-width: 1; }
    </style>
  </defs>

  <!-- page background -->
  <rect class="bg" width="900" height="760"/>

  <!-- nav bar -->
  <rect x="0" y="0" width="900" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#e5e5e5"/>
  <text x="32" y="36" class="fg" font-size="17" font-weight="600">Time Keeper</text>
  <text x="560" y="36" class="muted" font-size="14">Report</text>
  <text x="620" y="36" class="muted" font-size="14">Sessions</text>
  <text x="692" y="36" class="muted" font-size="14">Tags</text>
  <text x="734" y="36" class="muted" font-size="14">Review</text>
  <!-- bell -->
  <g transform="translate(790 22)">
    <path d="M6 0 a6 6 0 0 1 6 6 v4 l2 3 H-2 l2-3 v-4 a6 6 0 0 1 6-6 z" fill="none" stroke="#171717" stroke-width="1.4"/>
    <path d="M4 14 a2 2 0 0 0 4 0" fill="none" stroke="#171717" stroke-width="1.4"/>
    <circle cx="12" cy="2" r="3" fill="#dc2626"/>
    <text x="11" y="4" fill="#ffffff" font-size="5" text-anchor="middle" font-weight="700">2</text>
  </g>
  <!-- notes icon -->
  <g transform="translate(828 20)" fill="none" stroke="#171717" stroke-width="1.4">
    <rect x="0" y="0" width="16" height="18" rx="2"/>
    <line x1="3" y1="5" x2="13" y2="5"/>
    <line x1="3" y1="9" x2="13" y2="9"/>
    <line x1="3" y1="13" x2="9" y2="13"/>
  </g>
  <!-- avatar -->
  <circle cx="862" cy="28" r="12" fill="#e5e5e5"/>
  <text x="862" y="32" text-anchor="middle" fill="#737373" font-size="11" font-weight="600">JT</text>

  <!-- main column -->
  <!-- Active timer card -->
  <rect class="card" x="260" y="88" width="504" height="150" rx="12"/>
  <text x="284" y="116" class="fg" font-size="15" font-weight="500">Fix OAuth callback bug</text>
  <!-- tags inline -->
  <text x="456" y="116" font-size="14" fill="#3b82f6">#backend</text>
  <text x="528" y="116" font-size="14" fill="#ef4444">#auth</text>
  <!-- link icon -->
  <g transform="translate(596 104)" fill="none" stroke="#737373" stroke-width="1.3">
    <path d="M3 7 a3 3 0 0 1 3-3 h2"/>
    <path d="M9 5 a3 3 0 0 1 3 3 v0 a3 3 0 0 1-3 3 h-2"/>
    <line x1="5" y1="8" x2="10" y2="8"/>
  </g>

  <!-- big timer -->
  <text x="284" y="186" class="fg mono" font-size="44" font-weight="500">00:42:17</text>

  <!-- stop button -->
  <rect class="destructive" x="656" y="158" width="84" height="40" rx="8"/>
  <text x="698" y="184" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Stop</text>

  <!-- bump buttons -->
  <rect class="mutedCard" x="284" y="204" width="50" height="26" rx="6"/>
  <text x="309" y="222" text-anchor="middle" class="fg" font-size="12" font-weight="500">+5m</text>
  <rect class="mutedCard" x="342" y="204" width="54" height="26" rx="6"/>
  <text x="369" y="222" text-anchor="middle" class="fg" font-size="12" font-weight="500">+15m</text>
  <rect class="mutedCard" x="404" y="204" width="54" height="26" rx="6"/>
  <text x="431" y="222" text-anchor="middle" class="fg" font-size="12" font-weight="500">+30m</text>

  <!-- total time -->
  <text x="740" y="222" text-anchor="end" class="muted" font-size="12">Total: 2h 18m</text>

  <!-- Active tags bar -->
  <g transform="translate(260 258)">
    <!-- tag chip backend -->
    <rect class="tagPill" x="0" y="0" width="84" height="26" rx="13" stroke="#3b82f6"/>
    <circle cx="12" cy="13" r="4" fill="#3b82f6"/>
    <text x="22" y="17" fill="#3b82f6" font-size="12" font-weight="500">backend</text>
    <g transform="translate(68 10)" stroke="#3b82f6" stroke-width="1.3">
      <line x1="0" y1="0" x2="6" y2="6"/>
      <line x1="6" y1="0" x2="0" y2="6"/>
    </g>
    <!-- tag chip auth -->
    <rect class="tagPill" x="92" y="0" width="68" height="26" rx="13" stroke="#ef4444"/>
    <circle cx="104" cy="13" r="4" fill="#ef4444"/>
    <text x="114" y="17" fill="#ef4444" font-size="12" font-weight="500">auth</text>
    <g transform="translate(148 10)" stroke="#ef4444" stroke-width="1.3">
      <line x1="0" y1="0" x2="6" y2="6"/>
      <line x1="6" y1="0" x2="0" y2="6"/>
    </g>
    <!-- add tag -->
    <rect class="mutedCard" x="168" y="0" width="74" height="26" rx="13"/>
    <text x="181" y="17" class="muted" font-size="12">+ Add tag</text>
  </g>

  <!-- New task input -->
  <rect class="card" x="260" y="296" width="504" height="44" rx="8"/>
  <text x="278" y="322" class="faint" font-size="14">What are you working on?</text>
  <rect class="primaryBtn" x="696" y="304" width="56" height="28" rx="6"/>
  <text x="724" y="323" text-anchor="middle" fill="#fafafa" font-size="12" font-weight="600">Start</text>

  <!-- ToDo queue -->
  <g transform="translate(260 362)">
    <text x="0" y="10" class="muted" font-size="11" font-weight="600" letter-spacing="0.06em">TO DO (2)</text>
    <!-- row 1 -->
    <rect class="mutedCard" x="0" y="22" width="504" height="38" rx="8"/>
    <text x="16" y="45" class="fg" font-size="14">Write migration for notifications table</text>
    <circle cx="350" cy="41" r="4" fill="#14b8a6"/>
    <text x="358" y="45" fill="#14b8a6" font-size="12">#backend</text>
    <text x="488" y="45" text-anchor="end" class="muted" font-size="11">Tue</text>
    <!-- row 2 -->
    <rect class="mutedCard" x="0" y="66" width="504" height="38" rx="8"/>
    <text x="16" y="89" class="fg" font-size="14">Review pull request #204</text>
    <circle cx="350" cy="85" r="4" fill="#a855f7"/>
    <text x="358" y="89" fill="#a855f7" font-size="12">#reviews</text>
    <text x="488" y="89" text-anchor="end" class="muted" font-size="11">Today</text>
  </g>

  <!-- Recent section header -->
  <text x="260" y="496" class="muted" font-size="11" font-weight="600" letter-spacing="0.06em">RECENT</text>

  <!-- Recent rows -->
  <g transform="translate(260 508)">
    <!-- row 1 -->
    <line x1="0" y1="40" x2="504" y2="40" stroke="#f0f0f0"/>
    <text x="0" y="26" class="fg" font-size="14">Fix OAuth callback bug</text>
    <circle cx="262" cy="22" r="3.5" fill="#3b82f6"/>
    <text x="270" y="26" fill="#3b82f6" font-size="12">#backend</text>
    <circle cx="332" cy="22" r="3.5" fill="#ef4444"/>
    <text x="340" y="26" fill="#ef4444" font-size="12">#auth</text>
    <text x="504" y="26" text-anchor="end" class="fg mono" font-size="12">42m</text>

    <!-- row 2 -->
    <line x1="0" y1="82" x2="504" y2="82" stroke="#f0f0f0"/>
    <text x="0" y="68" class="fg" font-size="14">Sprint planning notes</text>
    <circle cx="262" cy="64" r="3.5" fill="#f59e0b"/>
    <text x="270" y="68" fill="#f59e0b" font-size="12">#planning</text>
    <text x="504" y="68" text-anchor="end" class="fg mono" font-size="12">25m</text>

    <!-- row 3 -->
    <line x1="0" y1="124" x2="504" y2="124" stroke="#f0f0f0"/>
    <text x="0" y="110" class="fg" font-size="14">Triage incoming bugs</text>
    <circle cx="262" cy="106" r="3.5" fill="#22c55e"/>
    <text x="270" y="110" fill="#22c55e" font-size="12">#ops</text>
    <text x="504" y="110" text-anchor="end" class="fg mono" font-size="12">1h 12m</text>

    <!-- row 4 -->
    <line x1="0" y1="166" x2="504" y2="166" stroke="#f0f0f0"/>
    <text x="0" y="152" class="fg" font-size="14">Respond to design review</text>
    <circle cx="262" cy="148" r="3.5" fill="#a855f7"/>
    <text x="270" y="152" fill="#a855f7" font-size="12">#reviews</text>
    <text x="504" y="152" text-anchor="end" class="fg mono" font-size="12">18m</text>
  </g>

  <!-- Last 7 Days collapsed -->
  <g transform="translate(260 698)">
    <path d="M0 6 l6 -6 l6 6" fill="none" stroke="#737373" stroke-width="1.3"/>
    <text x="18" y="10" class="muted" font-size="11" font-weight="600" letter-spacing="0.06em">LAST 7 DAYS</text>
  </g>
</svg>
