<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #e5e5e5; stroke-width: 1; }
      .mutedCard { fill: #fafafa; stroke: #e5e5e5; stroke-width: 1; }
      .fg { fill: #171717; }
      .muted { fill: #737373; }
      .faint { fill: #a3a3a3; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    </style>
  </defs>
  <rect class="bg" width="900" height="640"/>

  <!-- nav bar -->
  <rect x="0" y="0" width="900" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#e5e5e5"/>
  <text x="32" y="36" class="fg" font-size="17" font-weight="600">Time Keeper</text>
  <text x="560" y="36" class="muted" font-size="14">Report</text>
  <text x="620" y="36" class="fg" font-size="14" font-weight="600">Sessions</text>
  <text x="692" y="36" class="muted" font-size="14">Tags</text>
  <text x="734" y="36" class="muted" font-size="14">Review</text>
  <circle cx="862" cy="28" r="12" fill="#e5e5e5"/>
  <text x="862" y="32" text-anchor="middle" fill="#737373" font-size="11" font-weight="600">JT</text>

  <!-- page header -->
  <text x="48" y="100" class="fg" font-size="24" font-weight="600">Sessions</text>

  <!-- date range + add button -->
  <g transform="translate(48 124)">
    <rect class="mutedCard" x="0" y="0" width="160" height="36" rx="8"/>
    <text x="14" y="23" class="fg" font-size="13">Apr 16, 2026</text>
    <text x="140" y="23" class="muted" font-size="13">▾</text>
    <text x="170" y="23" class="muted" font-size="13">→</text>
    <rect class="mutedCard" x="190" y="0" width="160" height="36" rx="8"/>
    <text x="204" y="23" class="fg" font-size="13">Apr 23, 2026</text>
    <text x="330" y="23" class="muted" font-size="13">▾</text>

    <rect fill="#171717" x="644" y="0" width="160" height="36" rx="8"/>
    <text x="724" y="23" text-anchor="middle" fill="#fafafa" font-size="13" font-weight="600">+ Add session</text>
  </g>

  <!-- day group -->
  <text x="48" y="192" class="muted" font-size="12" font-weight="600" letter-spacing="0.06em">THURSDAY · APR 23</text>
  <text x="852" y="192" text-anchor="end" class="muted mono" font-size="12">5h 47m</text>
  <line x1="48" y1="202" x2="852" y2="202" stroke="#e5e5e5"/>

  <!-- session rows -->
  <g transform="translate(48 214)">
    <!-- row 1 -->
    <rect class="card" x="0" y="0" width="804" height="54" rx="10"/>
    <text x="20" y="24" class="fg" font-size="14" font-weight="500">Fix OAuth callback bug</text>
    <circle cx="20" cy="42" r="3.5" fill="#3b82f6"/>
    <text x="28" y="46" fill="#3b82f6" font-size="11">#backend</text>
    <circle cx="92" cy="42" r="3.5" fill="#ef4444"/>
    <text x="100" y="46" fill="#ef4444" font-size="11">#auth</text>
    <text x="520" y="33" text-anchor="end" class="muted mono" font-size="12">09:12 → 09:54</text>
    <text x="624" y="33" text-anchor="end" class="fg mono" font-size="13" font-weight="500">42m</text>
    <g transform="translate(660 20)" fill="none" stroke="#737373" stroke-width="1.3">
      <rect x="0" y="0" width="16" height="16" rx="3"/>
      <path d="M4 4 l8 8 M12 4 l-8 8"/>
    </g>
    <g transform="translate(690 20)" fill="none" stroke="#737373" stroke-width="1.3">
      <path d="M2 11 l0 3 l3 0 l9-9 l-3-3 l-9 9 z"/>
    </g>
    <g transform="translate(720 20)" fill="none" stroke="#dc2626" stroke-width="1.3">
      <path d="M2 3 h12 M5 3 v-1 h6 v1 M4 3 v11 a1 1 0 0 0 1 1 h6 a1 1 0 0 0 1-1 v-11"/>
    </g>

    <!-- row 2 -->
    <rect class="card" x="0" y="64" width="804" height="54" rx="10"/>
    <text x="20" y="88" class="fg" font-size="14" font-weight="500">Triage incoming bugs</text>
    <circle cx="20" cy="106" r="3.5" fill="#22c55e"/>
    <text x="28" y="110" fill="#22c55e" font-size="11">#ops</text>
    <text x="520" y="97" text-anchor="end" class="muted mono" font-size="12">10:01 → 11:13</text>
    <text x="624" y="97" text-anchor="end" class="fg mono" font-size="13" font-weight="500">1h 12m</text>

    <!-- row 3 -->
    <rect class="card" x="0" y="128" width="804" height="54" rx="10"/>
    <text x="20" y="152" class="fg" font-size="14" font-weight="500">Sprint planning notes</text>
    <circle cx="20" cy="170" r="3.5" fill="#f59e0b"/>
    <text x="28" y="174" fill="#f59e0b" font-size="11">#planning</text>
    <text x="520" y="161" text-anchor="end" class="muted mono" font-size="12">13:15 → 14:03</text>
    <text x="624" y="161" text-anchor="end" class="fg mono" font-size="13" font-weight="500">48m</text>

    <!-- row 4 -->
    <rect class="card" x="0" y="192" width="804" height="54" rx="10"/>
    <text x="20" y="216" class="fg" font-size="14" font-weight="500">Write migration for notifications table</text>
    <circle cx="20" cy="234" r="3.5" fill="#14b8a6"/>
    <text x="28" y="238" fill="#14b8a6" font-size="11">#backend/db</text>
    <text x="520" y="225" text-anchor="end" class="muted mono" font-size="12">14:20 → 15:12</text>
    <text x="624" y="225" text-anchor="end" class="fg mono" font-size="13" font-weight="500">52m</text>

    <!-- row 5 -->
    <rect class="card" x="0" y="256" width="804" height="54" rx="10"/>
    <text x="20" y="280" class="fg" font-size="14" font-weight="500">Respond to design review</text>
    <circle cx="20" cy="298" r="3.5" fill="#a855f7"/>
    <text x="28" y="302" fill="#a855f7" font-size="11">#reviews</text>
    <text x="520" y="289" text-anchor="end" class="muted mono" font-size="12">15:30 → 16:06</text>
    <text x="624" y="289" text-anchor="end" class="fg mono" font-size="13" font-weight="500">36m</text>

    <!-- row 6: active -->
    <rect class="card" x="0" y="320" width="804" height="54" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="344" class="fg" font-size="14" font-weight="500">Fix OAuth callback bug</text>
    <circle cx="20" cy="362" r="3.5" fill="#3b82f6"/>
    <text x="28" y="366" fill="#3b82f6" font-size="11">#backend</text>
    <circle cx="92" cy="362" r="3.5" fill="#ef4444"/>
    <text x="100" y="366" fill="#ef4444" font-size="11">#auth</text>
    <text x="520" y="353" text-anchor="end" class="muted mono" font-size="12">16:30 → now</text>
    <text x="624" y="353" text-anchor="end" fill="#3b82f6" font-size="13" font-weight="600" font-family="ui-monospace, monospace">● 42:17</text>
  </g>
</svg>
